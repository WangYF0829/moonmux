name: toolchain pin check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pin:
    name: verify pinned toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-moonbit

      - name: Assert exact toolchain and build
        shell: bash
        run: |
          set -euo pipefail
          moon version --all
          moon version --all | grep -q 'moon 0.1.20261117'
          moon version --all | grep -q 'v0.10.21+06da1ed44'
          moon update
          moon check --deny-warn
          moon test --deny-warn --target native -p cli
